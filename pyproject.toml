[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatiff"
version = "0.1.0"
description = "Counterfactual action-selection evaluation for tabletop observations"
requires-python = ">=3.9"
dependencies = ["Pillow>=10.4,<12", "fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.40", "python-multipart>=0.0.18,<0.1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<0.29"]

[project.scripts]
whatiff-meta = "whatiff.live:main"
whatiff-demo = "whatiff.demo:main"
whatiff-web = "whatiff.web:main"

[tool.setuptools.packages.find]
include = ["whatiff*"]
